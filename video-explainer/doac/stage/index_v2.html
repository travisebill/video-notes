<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>DOAC × Friedberg — 解說動畫 v2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Archivo+Black&family=Caveat:wght@600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#0d1220; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; }
  .scene { position:absolute; inset:0; width:1920px; height:1080px;
    background:#f6f1e4; color:#1c1c1c; overflow:hidden;
    font-family:'Noto Sans TC',sans-serif; opacity:0; }
  /* 紙紋 + 顆粒疊層（讓它像動畫不像簡報） */
  .grain { position:absolute; inset:0; pointer-events:none; opacity:.5; z-index:60;
    background-image:radial-gradient(circle at 30% 20%, rgba(0,0,0,.04) 1px, transparent 1px),
                     radial-gradient(circle at 70% 65%, rgba(0,0,0,.035) 1px, transparent 1px),
                     radial-gradient(circle at 12% 80%, rgba(0,0,0,.03) 1px, transparent 1px);
    background-size:6px 6px, 9px 9px, 13px 13px; }
  .vign { position:absolute; inset:0; pointer-events:none; z-index:59;
    background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(28,28,28,.14) 100%); }

  .top-id { position:absolute; top:40px; left:60px; right:60px; display:flex;
    align-items:baseline; justify-content:space-between; }
  .brand { font-size:29px; font-weight:900; letter-spacing:4px; color:#e8542f; }
  .brand small { font-size:21px; color:#9a9188; letter-spacing:1px; font-weight:700; }
  .top-right { font-size:23px; font-weight:700; color:#9a9188; }

  .title-wrap { position:absolute; top:78px; left:60px; right:60px; }
  .mega { font-size:74px; font-weight:900; line-height:1.06; }
  .mega .ink2 { color:#2f6fa8; }
  .subtitle { font-family:'Caveat',cursive; font-size:38px; color:#6b6259; margin-top:4px; line-height:1.15; }

  .stagebox { position:absolute; left:60px; top:322px; width:1090px; height:566px;
    border:5px solid #1c1c1c; border-radius:26px; background:#fffdf7; overflow:hidden; z-index:10; }
  .stage-content { position:absolute; inset:0; z-index:1; }
  .stagebox .grid { position:absolute; inset:0; opacity:.45;
    background-image:linear-gradient(#eee7d8 2px, transparent 2px),
                     linear-gradient(90deg,#eee7d8 2px, transparent 2px);
    background-size:64px 64px; }
  .stage-caption { position:absolute; left:0; right:0; bottom:16px; text-align:center;
    font-size:25px; font-weight:700; color:#6b6259; z-index:30;
    background:linear-gradient(to top, #fffdf7 60%, rgba(255,253,247,0));
    padding:10px 0; }

  .cmd { position:absolute; right:60px; top:322px; width:646px; height:566px;
    background:#141b2b; color:#f6f1e4; border-radius:26px; padding:42px 44px;
    box-shadow:16px 16px 0 rgba(28,28,28,.18); display:flex; flex-direction:column; }
  .cmd .step { font-size:25px; font-weight:900; letter-spacing:3px; color:#f2b53a; }
  .cmd .verb { font-size:78px; font-weight:900; line-height:1.06; margin-top:12px; }
  .cmd .obj { font-size:42px; font-weight:900; color:#8fd0ff; margin-top:10px; }
  .cmd .note { font-size:25px; color:#9aa4b8; margin-top:16px; line-height:1.5; }

  .rail { position:absolute; left:60px; right:60px; bottom:48px; }
  .rail-line { position:absolute; left:58px; right:58px; top:30px; height:6px; background:#ded6c6; border-radius:3px; }
  .rail-fill { position:absolute; left:58px; top:30px; height:6px; background:#e8542f; border-radius:3px; width:0; }
  .rail-nodes { position:relative; display:flex; justify-content:space-between; }
  .node { width:120px; text-align:center; }
  .dot { width:60px; height:60px; border-radius:50%; background:#fff; border:4px solid #ded6c6;
    display:flex; align-items:center; justify-content:center; font-size:27px; font-weight:900;
    color:#b4ab9d; margin:0 auto; position:relative; z-index:2; }
  .node.done .dot { background:#e8542f; border-color:#e8542f; color:#fff; }
  .node.active .dot { background:#fff; border-color:#e8542f; color:#e8542f; }
  .nlabel { font-size:20px; font-weight:700; color:#b4ab9d; margin-top:10px; line-height:1.2; }
  .node.done .nlabel, .node.active .nlabel { color:#1c1c1c; }

  .fig { position:absolute; }
  .obj-item { position:absolute; }
  /* 舞台內所有圖形／物件一律不得高於字幕條（z:30），避免壓到說明文字 */
  .stage-content .fig, .stage-content .obj-item { z-index:1; }
  .num { font-family:'Archivo Black',sans-serif; }
</style>
</head>
<body>
  <div id="stage"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="scenes_v2.js"></script>
  <script src="boot_v2.js"></script>
</body>
</html>
